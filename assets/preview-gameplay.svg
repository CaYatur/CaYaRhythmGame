<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="CaYa Rhythm gameplay">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0820"/><stop offset="1" stop-color="#05030f"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0820"/><stop offset="1" stop-color="#100c26"/></linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.1" r="0.5"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.45"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="640" fill="url(#sky)"/>
  <rect width="1000" height="280" fill="url(#horizonGlow)"/>

  <!-- ===== perspektif otoyol (VP = 500,20) ===== -->
  <!-- zemin: boundary0 alt(120,640)->ust(473,64) ; boundary5 ust(527,64)->alt(880,640) -->
  <polygon points="120,640 473,64 527,64 880,640" fill="url(#road)"/>
  <!-- ic serit cizgileri (boundary 1..4) -->
  <g stroke="#5a4f8a" stroke-opacity="0.5" stroke-width="1.4">
    <line x1="272" y1="640" x2="483.8" y2="64"/>
    <line x1="424" y1="640" x2="494.6" y2="64"/>
    <line x1="576" y1="640" x2="505.4" y2="64"/>
    <line x1="728" y1="640" x2="516.2" y2="64"/>
  </g>
  <!-- yan raylar (boundary0 & boundary5, neon mor) -->
  <g fill="#7c4dff" filter="url(#g2)">
    <polygon points="113,640 127,640 476,64 470,64"/>
    <polygon points="873,640 887,640 530,64 524,64"/>
  </g>

  <!-- yaklasan notalar (serit merkezlerine hizali) -->
  <g filter="url(#g)">
    <rect x="490.0" y="146" width="20" height="8"  rx="3" fill="#ffffff"/>   <!-- boost · lane2 · y150 -->
    <rect x="532.1" y="204.5" width="29" height="11" rx="4" fill="#7dffa0"/> <!-- green · lane3 · y210 -->
    <rect x="419.7" y="263" width="38" height="14" rx="4" fill="#ff6fb0"/>   <!-- pink · lane1 · y270 -->
    <rect x="302.4" y="360.5" width="52" height="19" rx="5" fill="#5ad8ff"/> <!-- cyan · lane0 · y370 -->
  </g>

  <!-- vurus cizgisi seridi (yR=500) -->
  <rect x="205.8" y="498.5" width="588.4" height="3" fill="#ffffff" fill-opacity="0.16"/>
  <!-- vurus bolgeleri (receptor) : serit merkezlerinde, yR=500 -->
  <g filter="url(#g)">
    <rect x="220.6" y="485" width="88" height="30" rx="7" fill="#0c1820" stroke="#35c4f0" stroke-width="3"/>
    <rect x="338.3" y="485" width="88" height="30" rx="7" fill="#1a0c14" stroke="#f0509b" stroke-width="3"/>
    <rect x="456.0" y="485" width="88" height="30" rx="7" fill="#1a160a" stroke="#ffd23d" stroke-width="3"/>
    <rect x="573.7" y="485" width="88" height="30" rx="7" fill="#0c1a10" stroke="#59d96b" stroke-width="3"/>
    <rect x="691.4" y="485" width="88" height="30" rx="7" fill="#170c20" stroke="#b06af5" stroke-width="3"/>
  </g>

  <!-- ===== HUD ===== -->
  <rect x="0" y="0" width="1000" height="4" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="0" y="0" width="540" height="4" fill="#35c4f0" filter="url(#g)"/>

  <g transform="translate(26,18)">
    <rect width="300" height="34" rx="9" fill="#140e2d" fill-opacity="0.85" stroke="#7c4dff" stroke-opacity="0.35"/>
    <text x="14" y="22" font-size="14" fill="#ece8ff">Neon Drive — Master · Mixed</text>
  </g>
  <g transform="translate(974,20)" text-anchor="end">
    <text x="0" y="30" font-size="38" font-weight="900" fill="#ece8ff" filter="url(#g)">1,284,500</text>
    <text x="0" y="54" font-size="16" fill="#9a90c4">98.7%</text>
  </g>

  <!-- carpan halkasi (sol) -->
  <g transform="translate(70,300)">
    <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="9"/>
    <circle r="44" fill="none" stroke="#7c4dff" stroke-width="9" stroke-linecap="round" stroke-dasharray="207 277" transform="rotate(-90)" filter="url(#g)"/>
    <circle r="36" fill="#0a061a"/>
    <text y="11" text-anchor="middle" font-size="29" font-weight="900" fill="#ece8ff">x4</text>
    <text y="70" text-anchor="middle" font-size="11" letter-spacing="3" fill="#9a90c4">MULTIPLIER</text>
  </g>

  <!-- boost bar (sag) -->
  <g transform="translate(940,250)">
    <rect x="-4" y="-6" width="32" height="220" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#7c4dff" stroke-opacity="0.35"/>
    <rect x="1" y="112" width="22" height="48" rx="7" fill="#9fd0ff" filter="url(#g)"/>
    <rect x="1" y="60"  width="22" height="48" rx="7" fill="#9fd0ff" filter="url(#g)"/>
    <text x="12" y="232" text-anchor="middle" font-size="11" letter-spacing="3" fill="#cfe6ff">BOOST</text>
    <rect x="-7" y="240" width="38" height="22" rx="6" fill="#1b2433" stroke="#7c4dff" stroke-opacity="0.4"/>
    <text x="12" y="255" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ece8ff">R2</text>
  </g>

  <!-- merkez: judgment + combo -->
  <g text-anchor="middle">
    <text x="500" y="250" font-size="42" font-weight="900" letter-spacing="4" fill="#7df0ff" filter="url(#g)">PERFECT</text>
    <text x="500" y="322" font-size="54" font-weight="900" fill="#ece8ff" filter="url(#g)">128</text>
    <text x="500" y="346" font-size="13" letter-spacing="6" fill="#9a90c4">COMBO</text>
  </g>

  <!-- serit tuslari (en dipte, serit merkezlerine hizali, yK=612) -->
  <g filter="url(#g)" fill="#08051699">
    <g><rect x="186.7" y="595" width="46" height="34" rx="9" stroke="#7c4dff" stroke-opacity="0.4"/>
       <path d="M216.7 604 l-14 8 l14 8" fill="none" stroke="#35c4f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g><rect x="331.9" y="595" width="46" height="34" rx="9" stroke="#7c4dff" stroke-opacity="0.4"/>
       <path d="M347.9 604 l14 8 l-14 8" fill="none" stroke="#35c4f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g><rect x="477.0" y="595" width="46" height="34" rx="9" stroke="#7c4dff" stroke-opacity="0.4"/>
       <rect x="491" y="603" width="18" height="18" rx="2" fill="none" stroke="#f0509b" stroke-width="3"/></g>
    <g><rect x="622.1" y="595" width="46" height="34" rx="9" stroke="#7c4dff" stroke-opacity="0.4"/>
       <path d="M645.1 603 l11 18 l-22 0 z" fill="none" stroke="#59d96b" stroke-width="3" stroke-linejoin="round"/></g>
    <g><rect x="767.3" y="595" width="46" height="34" rx="9" stroke="#7c4dff" stroke-opacity="0.4"/>
       <circle cx="790.3" cy="612" r="10" fill="none" stroke="#ff5566" stroke-width="3"/></g>
  </g>

  <!-- alt sol: duraklat -->
  <g transform="translate(26,592)" font-family="Consolas, monospace">
    <rect width="26" height="20" rx="5" fill="#1b2433" stroke="#7c4dff" stroke-opacity="0.4"/>
    <text x="13" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#ece8ff">Esc</text>
    <text x="34" y="14" font-size="10" letter-spacing="2" fill="#9a90c4">PAUSE</text>
  </g>
</svg>
