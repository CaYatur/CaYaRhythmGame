<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="CaYa Rhythm gameplay">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0820"/><stop offset="1" stop-color="#05030f"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0820"/><stop offset="1" stop-color="#100c26"/></linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.12" r="0.5"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.45"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="640" fill="url(#sky)"/>
  <rect width="1000" height="260" fill="url(#horizonGlow)"/>

  <!-- otoyol -->
  <polygon points="120,640 880,640 535,70 465,70" fill="url(#road)"/>
  <!-- yan raylar (neon mor) -->
  <polygon points="108,640 132,640 468,70 462,70" fill="#7c4dff" filter="url(#g2)"/>
  <polygon points="868,640 892,640 538,70 532,70" fill="#7c4dff" filter="url(#g2)"/>
  <!-- serit cizgileri -->
  <g stroke="#5a4f8a" stroke-opacity="0.5" stroke-width="1.4">
    <line x1="180" y1="640" x2="479" y2="70"/>
    <line x1="340" y1="640" x2="493" y2="70"/>
    <line x1="500" y1="640" x2="507" y2="70"/>
    <line x1="660" y1="640" x2="521" y2="70"/>
  </g>

  <!-- yaklasan notalar (uzaktan yakina) -->
  <g filter="url(#g)">
    <rect x="488" y="166" width="24" height="9" rx="3" fill="#fff"/>            <!-- boost (beyaz) -->
    <rect x="540" y="224" width="34" height="12" rx="4" fill="#7dffa0"/>         <!-- yesil -->
    <rect x="409" y="294" width="40" height="15" rx="4" fill="#ff6fb0"/>         <!-- pembe -->
    <rect x="296" y="372" width="50" height="19" rx="5" fill="#5ad8ff"/>         <!-- cyan -->
  </g>

  <!-- vurus bolgeleri (receptor) y~512 -->
  <g filter="url(#g)">
    <rect x="200" y="497" width="92" height="32" rx="7" fill="#0c1820" stroke="#35c4f0" stroke-width="3"/>
    <rect x="327" y="497" width="92" height="32" rx="7" fill="#1a0c14" stroke="#f0509b" stroke-width="3"/>
    <rect x="454" y="495" width="92" height="34" rx="7" fill="#1a160a" stroke="#ffd23d" stroke-width="3"/>
    <rect x="581" y="497" width="92" height="32" rx="7" fill="#0c1a10" stroke="#59d96b" stroke-width="3"/>
    <rect x="708" y="497" width="92" height="32" rx="7" fill="#170c20" stroke="#b06af5" stroke-width="3"/>
  </g>
  <rect x="190" y="511" width="620" height="3" fill="#fff" fill-opacity="0.16"/>

  <!-- ===== HUD ===== -->
  <!-- ust progress -->
  <rect x="0" y="0" width="1000" height="4" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="0" y="0" width="540" height="4" fill="#35c4f0" filter="url(#g)"/>

  <!-- sol ust: sarki -->
  <g transform="translate(26,18)">
    <rect width="300" height="34" rx="9" fill="#140e2d" fill-opacity="0.85" stroke="#7c4dff" stroke-opacity="0.35"/>
    <text x="14" y="22" font-size="14" fill="#ece8ff">Neon Drive — Master · Mixed</text>
  </g>
  <!-- sag ust: skor + dogruluk -->
  <g transform="translate(974,20)" text-anchor="end">
    <text x="0" y="30" font-size="38" font-weight="900" fill="#ece8ff" filter="url(#g)">1,284,500</text>
    <text x="0" y="54" font-size="16" fill="#9a90c4">98.7%</text>
  </g>

  <!-- sol orta: carpan halkasi -->
  <g transform="translate(70,330)">
    <circle r="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="9"/>
    <circle r="46" fill="none" stroke="#7c4dff" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="216 289" transform="rotate(-90)" filter="url(#g)"/>
    <circle r="38" fill="#0a061a"/>
    <text y="11" text-anchor="middle" font-size="30" font-weight="900" fill="#ece8ff">x4</text>
    <text y="74" text-anchor="middle" font-size="11" letter-spacing="3" fill="#9a90c4">MULTIPLIER</text>
  </g>

  <!-- sag orta: boost bar (4 segment, 2 dolu) -->
  <g transform="translate(936,210)">
    <rect x="-4" y="-6" width="32" height="232" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#7c4dff" stroke-opacity="0.35"/>
    <rect x="1" y="119" width="22" height="52" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="1" y="64"  width="22" height="52" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="1" y="119" width="22" height="52" rx="7" fill="#9fd0ff" filter="url(#g)"/>
    <rect x="1" y="64"  width="22" height="52" rx="7" fill="#9fd0ff" filter="url(#g)"/>
    <text x="12" y="244" text-anchor="middle" font-size="11" letter-spacing="3" fill="#cfe6ff">BOOST</text>
    <rect x="-7" y="252" width="38" height="22" rx="6" fill="#1b2433" stroke="#7c4dff" stroke-opacity="0.4"/>
    <text x="12" y="267" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ece8ff">R2</text>
  </g>

  <!-- merkez: judgment + combo -->
  <g text-anchor="middle">
    <text x="500" y="250" font-size="42" font-weight="900" letter-spacing="4" fill="#7df0ff" filter="url(#g)">PERFECT</text>
    <text x="500" y="320" font-size="54" font-weight="900" fill="#ece8ff" filter="url(#g)">128</text>
    <text x="500" y="344" font-size="13" letter-spacing="6" fill="#9a90c4">COMBO</text>
  </g>

  <!-- alt: serit tuslari (en dipte, perspektife hizali) -->
  <g filter="url(#g)">
    <!-- lane keys: glyph chips at x = 191,346,500,654,809 ; y center ~612 -->
    <g>
      <rect x="167" y="594" width="48" height="36" rx="9" fill="#08051699" stroke="#7c4dff" stroke-opacity="0.4"/>
      <path d="M198 605 l-10 7 l10 7" fill="none" stroke="#35c4f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="322" y="594" width="48" height="36" rx="9" fill="#08051699" stroke="#7c4dff" stroke-opacity="0.4"/>
      <path d="M341 605 l10 7 l-10 7" fill="none" stroke="#35c4f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="476" y="594" width="48" height="36" rx="9" fill="#08051699" stroke="#7c4dff" stroke-opacity="0.4"/>
      <rect x="491" y="605" width="18" height="18" rx="2" fill="none" stroke="#f0509b" stroke-width="3"/>
    </g>
    <g>
      <rect x="630" y="594" width="48" height="36" rx="9" fill="#08051699" stroke="#7c4dff" stroke-opacity="0.4"/>
      <path d="M654 604 l11 19 l-22 0 z" fill="none" stroke="#59d96b" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="785" y="594" width="48" height="36" rx="9" fill="#08051699" stroke="#7c4dff" stroke-opacity="0.4"/>
      <circle cx="809" cy="612" r="10" fill="none" stroke="#ff5566" stroke-width="3"/>
    </g>
  </g>

  <!-- alt sol: duraklat -->
  <g transform="translate(26,592)" font-family="Consolas, monospace">
    <rect width="26" height="20" rx="5" fill="#1b2433" stroke="#7c4dff" stroke-opacity="0.4"/>
    <text x="13" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#ece8ff">Esc</text>
    <text x="34" y="14" font-size="10" letter-spacing="2" fill="#9a90c4">PAUSE</text>
  </g>
</svg>
