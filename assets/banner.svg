<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CaYa Rhythm">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080614"/><stop offset="1" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#35c4f0" stop-opacity="0.18"/><stop offset="1" stop-color="#35c4f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.1" cy="1" r="0.7">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.22"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f6f9c"/><stop offset="1" stop-color="#5ad8ff"/></linearGradient>
    <linearGradient id="pinkV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a02e63"/><stop offset="1" stop-color="#ff6fb0"/></linearGradient>
    <linearGradient id="goldV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9c7a1f"/><stop offset="1" stop-color="#ffd95a"/></linearGradient>
    <linearGradient id="greenV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f8c43"/><stop offset="1" stop-color="#7dffa0"/></linearGradient>
    <linearGradient id="purpleV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5b3aa6"/><stop offset="1" stop-color="#c08bff"/></linearGradient>
    <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bbg)"/>
  <rect width="1200" height="380" fill="url(#glowR)"/>
  <rect width="1200" height="380" fill="url(#glowL)"/>
  <!-- blueprint grid -->
  <g stroke="#8ca0d2" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 48H1200 M0 96H1200 M0 144H1200 M0 192H1200 M0 240H1200 M0 288H1200 M0 336H1200"/>
    <path d="M48 0V380 M96 0V380 M144 0V380 M192 0V380 M240 0V380 M288 0V380 M336 0V380 M384 0V380 M432 0V380 M480 0V380 M528 0V380 M576 0V380 M624 0V380 M672 0V380 M720 0V380 M768 0V380 M816 0V380 M864 0V380 M912 0V380 M960 0V380 M1008 0V380 M1056 0V380 M1104 0V380 M1152 0V380"/>
  </g>

  <!-- sag taraf: perspektif otoyol (VP = 995,58) — tek modelden hizali -->
  <g opacity="0.95">
    <polygon points="845,360 987.05,74 1002.95,74 1145,360" fill="#0c0a20" stroke="#7c4dff" stroke-opacity="0.2"/>
    <!-- ic serit cizgileri (boundary 1..3) -->
    <g stroke="#5a4f8a" stroke-opacity="0.5" stroke-width="1.4">
      <line x1="920" y1="360" x2="991" y2="74"/>
      <line x1="995" y1="360" x2="995" y2="74"/>
      <line x1="1070" y1="360" x2="999" y2="74"/>
    </g>
    <!-- yan raylar (boundary0 & boundary4) -->
    <g fill="#7c4dff" filter="url(#bglow)">
      <polygon points="842,360 848,360 989,74 985,74"/>
      <polygon points="1142,360 1148,360 1005,74 1001,74"/>
    </g>
    <!-- yaklasan notalar (serit merkezlerine hizali) -->
    <g filter="url(#bglow)">
      <rect x="922.5" y="209.5" width="28" height="11" rx="4" fill="#ff6fb0"/> <!-- pink · lane0 · y215 -->
      <rect x="996.4" y="146" width="20" height="8" rx="3" fill="#ffd95a"/>    <!-- gold · lane2 · y150 -->
      <rect x="980.5" y="107" width="16" height="6" rx="2.5" fill="#fff"/>     <!-- boost · lane1 · y110 -->
    </g>
    <!-- vurus bolgeleri (serit merkezlerinde, yR=320) -->
    <g filter="url(#bglow)">
      <rect x="873.4" y="309" width="48" height="22" rx="6" fill="#0c1820" stroke="#35c4f0" stroke-width="3"/>
      <rect x="938.5" y="309" width="48" height="22" rx="6" fill="#1a0c14" stroke="#f0509b" stroke-width="3"/>
      <rect x="1003.5" y="309" width="48" height="22" rx="6" fill="#1a160a" stroke="#ffd23d" stroke-width="3"/>
      <rect x="1068.6" y="309" width="48" height="22" rx="6" fill="#0c1a10" stroke="#59d96b" stroke-width="3"/>
    </g>
  </g>

  <!-- sol: logo + wordmark + slogan -->
  <g transform="translate(70,108)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#0c0a22" stroke="#7c4dff" stroke-opacity="0.5" stroke-width="2"/>
    <g filter="url(#bglow)" transform="translate(0,0)">
      <rect x="24" y="52" width="11" height="42" rx="4" fill="url(#cyanV)"/>
      <rect x="40" y="38" width="11" height="56" rx="4" fill="url(#pinkV)"/>
      <rect x="56" y="28" width="11" height="66" rx="4" fill="url(#goldV)"/>
      <rect x="72" y="44" width="11" height="50" rx="4" fill="url(#greenV)"/>
      <rect x="88" y="58" width="11" height="36" rx="4" fill="url(#purpleV)"/>
    </g>
    <rect x="20" y="92" width="84" height="5" rx="2.5" fill="#fff" fill-opacity="0.9" filter="url(#bglow)"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" transform="translate(214,150)">
    <text x="0" y="0" font-size="74" font-weight="900" letter-spacing="-2" fill="#ece8ff">CAYA</text>
    <rect x="218" y="-44" width="3" height="44" fill="#ffc83d"/>
    <text x="236" y="-8" font-size="30" font-weight="300" letter-spacing="14" fill="#35c4f0">RHYTHM</text>
    <text x="2" y="40" font-family="'Cascadia Code', Consolas, monospace" font-size="17" letter-spacing="2" fill="#9a90c4">AUTOMATIC RHYTHM EXTRACTOR — DROP · ANALYZE · PLAY</text>
  </g>
</svg>
