name: Deploy to GitHub Pages

# main'e her push'ta: testler -> statik site paketi -> GitHub Pages
# PR'larda yalniz test + paketleme calisir (yayin yok)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # puanlama + analiz motoru (sentetik yer gercegi) testleri
      - run: npm test

      # dahili test sarkisi (repoda tutulmaz, burada uretilir)
      - run: npm run make-test-song

      - run: node tools/build-pages.mjs

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
